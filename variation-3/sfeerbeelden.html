<html lang="nl">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<a class="skip" href="#main">Naar de inhoud</a>
<div id="site-header"></div>

<dialog class="lb" id="lb"><button aria-label="Sluiten">×</button><img alt=""></dialog>
<div id="site-footer"></div>
<script src="app.js"></script>
<script>
// Lightbox: native <dialog>, click anywhere to close.
const lb = document.getElementById('lb'), im = lb.querySelector('img');
document.querySelectorAll('.gallery a').forEach(a => a.onclick = e => { e.preventDefault(); im.src = a.href; im.alt = a.firstElementChild.alt; lb.showModal(); });
lb.onclick = () => lb.close();
</script>
</body>
</html>
